<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Certificate verification</title>
<style>
/* Deliberately unbranded: verification names no academy, so the page does not either. */
:root{--bg:#F4F6F9;--card:#FFFFFF;--ink:#16202E;--muted:#5B6878;--line:#DCE2EA;--ok:#1E8E4E;--ok-t:#E3F5EB;--bad:#9A3A3A;--bad-t:#F8EAEA}
@media (prefers-color-scheme:dark){:root{--bg:#0F1621;--card:#172131;--ink:#E9EEF5;--muted:#9AA8BA;--line:#27344A;--ok:#5BCB8E;--ok-t:#14301F;--bad:#E08A8A;--bad-t:#3A1E1E}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:22px;margin:6px 0 18px}
.status{border-radius:10px;padding:12px 14px;font-weight:600;margin-bottom:18px}
.status.ok{background:var(--ok-t);color:var(--ok)}
.status.bad{background:var(--bad-t);color:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px}
dt{color:var(--muted);font-size:13px}
dd{font-weight:600}
.serial{font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:.04em}
.note{color:var(--muted);font-size:12.5px;margin-top:20px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Certificate verification</div>
  <h1 class="serial" id="serial"></h1>
  <div class="status" id="status" hidden></div>
  <dl id="details" hidden>
    <dt>Awarded to</dt><dd id="holder"></dd>
    <dt>Course</dt><dd id="course"></dd>
    <dt>Issued</dt><dd id="issued"></dd>
  </dl>
  <p class="note">This page confirms a certificate's holder, course and issue date. It shows nothing else about the holder, and nothing about where they studied.</p>
</main>
<script>
// Every value from the server is written with textContent, never as HTML.
const $ = (id) => document.getElementById(id);
const serial = decodeURIComponent(location.pathname.split('/').pop() || '');
$('serial').textContent = serial || 'No serial given';

function show(kind, text) {
  const s = $('status');
  s.className = 'status ' + kind;
  s.textContent = text;
  s.hidden = false;
}

fetch('/api/v1/certificates/' + encodeURIComponent(serial), { headers: { accept: 'application/json' } })
  .then(async (res) => {
    if (res.status === 200) {
      const c = await res.json();
      $('holder').textContent = c.holderName;
      $('course').textContent = c.courseTitle;
      $('issued').textContent = new Date(c.issuedAt).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      $('details').hidden = false;
      show('ok', 'Valid certificate');
    } else if (res.status === 429) {
      show('bad', 'Too many checks from your network. Try again in a minute.');
    } else {
      show('bad', 'No valid certificate has this serial.');
    }
  })
  .catch(() => show('bad', 'Verification is unavailable right now. Try again shortly.'));
</script>
</body>
</html>
