<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketfolio Academy: solution prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --brand:#1A6DC2; --brand-d:#12508F; --brand-t:#E8F1FB; --accent:#F5C400; --accent-ink:#1F1A00;
  --bg:#F2F6FB; --surface:#FFFFFF; --surface-2:#F7FAFD; --line:#DDE6F1; --line-2:#EAF0F7;
  --ink:#14203A; --muted:#5D6D85; --faint:#93A3B8;
  --ok:#1E8E4E; --ok-t:#E3F5EB; --warn:#B4790E; --warn-t:#FCF3DC; --bad:#B23A3A; --bad-t:#FBEAEA;
  --r:16px; --r-s:11px; --r-l:22px;
  --learn:#2F7DD1; --safeguard:#0F8A7E; --apply:#B4790E; --specialise:#7B3F98;
  --sh-1:0 1px 2px rgba(20,32,58,.06); --sh-2:0 6px 20px -6px rgba(20,32,58,.16); --sh-3:0 20px 48px -16px rgba(20,32,58,.32);
  --brandtext:#fff;
}
/* Each academy's tokens are injected by the server after this sheet;
   the values above are only a fallback. */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s,color .3s}
h1,h2,h3,h4,h5,.ff{font-family:Poppins,system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--brand)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* ============ SHELL ============ */
#app{height:100%;display:flex;flex-direction:column}
.topbar{height:60px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;position:relative;z-index:40}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark .bm{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.brandmark .bm svg{width:19px;height:19px;fill:none;stroke:var(--brandtext);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brandmark b{font-family:Poppins;font-size:15.5px;font-weight:700;white-space:nowrap}
.brandmark small{display:block;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.hud{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip svg{width:14px;height:14px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.xp svg{stroke:var(--brand)} .chip.streak svg{stroke:#E0692B} .chip.coin svg{stroke:var(--accent)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;transition:.15s}
.iconbtn:hover{background:var(--surface-2);border-color:var(--brand)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{background:var(--brand);border-color:var(--brand)}
.iconbtn.on svg{stroke:var(--brandtext)}

.themepick{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.themepick button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;transition:.15s;position:relative}
.themepick button.on{border-color:var(--ink)}
.stage{flex:1;display:flex;min-height:0;position:relative}
.stage.phone{padding:16px;justify-content:center;background:
  radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--brand) 12%, transparent), transparent 60%), var(--bg)}
.viewport{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.stage.phone .viewport{max-width:400px;border:1px solid var(--line);border-radius:26px;background:var(--bg);
  box-shadow:var(--sh-3);overflow:hidden}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.wrap{max-width:1080px;margin:0 auto;padding:22px 22px 90px;width:100%}
.stage.phone .wrap{padding:16px 14px 90px}

/* ============ NAV ============ */
.tabbar{flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;color:var(--faint);font-size:10.5px;font-weight:700}
.tabbar button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand);background:var(--brand-t)}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-1)}
.card+.card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--brand);color:var(--brandtext);
  border-radius:var(--r-s);padding:12px 20px;font-family:Poppins;font-weight:600;font-size:14.5px;
  box-shadow:var(--sh-1);transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:none}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-family:Poppins;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.h1{font-size:30px;font-weight:800;line-height:1.14;margin:9px 0 10px}
.h2{font-size:21px;font-weight:700;margin-bottom:6px}
.h3{font-size:16.5px;font-weight:700}
.lead{color:var(--muted);font-size:15px;line-height:1.55}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.tiny{font-size:11.5px;color:var(--faint)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.sep{height:1px;background:var(--line-2);margin:16px 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;font-family:Poppins;
  border-radius:7px;padding:3px 9px;letter-spacing:.03em;text-transform:uppercase}
.tag.learn{background:color-mix(in srgb,var(--learn) 14%,transparent);color:var(--learn)}
.tag.safeguard{background:color-mix(in srgb,var(--safeguard) 14%,transparent);color:var(--safeguard)}
.tag.apply{background:color-mix(in srgb,var(--apply) 16%,transparent);color:var(--apply)}
.tag.specialise{background:color-mix(in srgb,var(--specialise) 15%,transparent);color:var(--specialise)}
.tag.ok{background:var(--ok-t);color:var(--ok)}
.tag.lock{background:var(--surface-2);color:var(--faint)}
.bar{height:9px;border-radius:9px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--brand);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.field input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;font-size:14.5px}
.field input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--surface)}
.pillbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;transition:.15s}
.pillbtn:hover{border-color:var(--brand)}
.pillbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brandtext)}
.fade{animation:fade .34s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}

/* ============ WELCOME ============ */
.hero{background:linear-gradient(140deg,var(--brand),var(--brand-d));color:#fff;border-radius:var(--r-l);padding:30px;position:relative;overflow:hidden}
html[data-mode="dark"] .hero{color:var(--accent-ink)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:28px;font-weight:800;line-height:1.16;margin-bottom:10px;position:relative}
.hero p{opacity:.92;font-size:15px;line-height:1.55;position:relative;max-width:46ch}
.promise{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;margin-bottom:14px;position:relative}

/* ============ PLACEMENT ============ */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qdots{display:flex;gap:5px}
.qdots i{width:22px;height:5px;border-radius:5px;background:var(--line);display:block}
.qdots i.done{background:var(--brand)} .qdots i.now{background:var(--accent)}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);
  background:var(--surface);border-radius:var(--r-s);padding:15px 16px;margin-bottom:10px;transition:.16s}
.opt:hover{border-color:var(--brand);transform:translateX(2px)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;
  font-weight:800;font-size:12.5px;flex:none;color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-t)}
.opt.right{border-color:var(--ok);background:var(--ok-t)}
.opt.wrong{border-color:var(--warn);background:var(--warn-t)}
.opt .txt{font-size:14px;line-height:1.45}
.rationale{border-radius:var(--r-s);padding:13px 15px;margin:4px 0 12px;font-size:13.5px;line-height:1.5}
.rationale.right{background:var(--ok-t);border-left:3px solid var(--ok)}
.rationale.wrong{background:var(--warn-t);border-left:3px solid var(--warn)}
.rationale b{display:block;font-family:Poppins;font-size:11.5px;letter-spacing:.12em;margin-bottom:4px}
.rationale.right b{color:var(--ok)} .rationale.wrong b{color:var(--warn)}
.slider{width:100%;appearance:none;height:7px;border-radius:7px;background:var(--line-2);outline:none}
.slider::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--brand);border:3px solid var(--surface);box-shadow:var(--sh-2);cursor:pointer}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brand);border:3px solid var(--surface);cursor:pointer}

/* ============ SKILL TREE ============ */
.treewrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  height:min(60vh,520px);box-shadow:var(--sh-1)}
.stage.phone .treewrap{height:56vh}
#tree{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#tree.drag{cursor:grabbing}
.treectl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.treectl button{width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh-1);font-weight:800;font-size:16px}
.treectl button:hover{border-color:var(--brand);color:var(--brand)}
.treelegend{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;max-width:70%}
.popover{position:absolute;width:268px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-3);padding:16px;z-index:20;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
.popover .steps{display:flex;align-items:center;gap:5px;margin:10px 0}
.popover .steps i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:var(--faint);font-style:normal}
.popover .steps i.done{background:var(--ok);border-color:var(--ok);color:#fff}
.popover .steps i.star{border-color:var(--accent);color:var(--accent)}
.reward{display:flex;gap:8px;margin:10px 0 12px}
.reward span{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:800}

/* ============ LESSON ============ */
.lessongrid{display:grid;grid-template-columns:232px 1fr;gap:16px;align-items:start}
.stage.phone .lessongrid,body.narrow .lessongrid{grid-template-columns:1fr}
.contents{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:0}
.contents h5{font-family:Poppins;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.contents a{display:flex;gap:9px;align-items:center;padding:8px 9px;border-radius:9px;font-size:13px;color:var(--ink);
  text-decoration:none;font-weight:600}
.contents a.on{background:var(--brand-t);color:var(--brand)}
.contents a i{width:19px;height:19px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;
  font-size:10px;font-weight:800;font-style:normal;flex:none;color:var(--muted)}
.contents a.on i{background:var(--brand);color:var(--brandtext)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;width:fit-content}
.tabs button{display:flex;align-items:center;gap:7px;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabs button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--surface);color:var(--brand);box-shadow:var(--sh-1)}
.player{position:relative;background:linear-gradient(150deg,#16233A,#0B1424);border-radius:var(--r);aspect-ratio:16/9;
  display:grid;place-items:center;overflow:hidden}
.player .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);
  display:grid;place-items:center;transition:.2s}
.player:hover .play{transform:scale(1.07);background:rgba(255,255,255,.26)}
.player .play svg{width:24px;height:24px;fill:#fff;stroke:none;margin-left:3px}
.player .meta{position:absolute;left:14px;bottom:12px;color:#fff;font-size:12px;opacity:.9}
.player .track{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.player .track i{display:block;height:100%;width:38%;background:var(--accent)}
.drawer-t{border:1px solid var(--line);border-radius:var(--r-s);margin-top:12px;overflow:hidden}
.drawer-t>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;
  font-weight:700;font-size:13.5px;background:var(--surface-2)}
.drawer-t .body{padding:6px 15px 14px;display:none}
.drawer-t.open .body{display:block}
.tline{display:flex;gap:12px;padding:7px 0;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line-2);cursor:pointer}
.tline:last-child{border-bottom:0}
.tline b{color:var(--brand);font-variant-numeric:tabular-nums;font-size:12.5px;flex:none;padding-top:1px}
.tline:hover{background:var(--surface-2)}
.step{display:flex;gap:14px;margin-bottom:16px}
.step .n{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brandtext);display:grid;place-items:center;
  font-family:Poppins;font-weight:800;font-size:13.5px;flex:none}
.step h4{font-size:15.5px;margin-bottom:4px}
.step p{font-size:14px;line-height:1.6;color:var(--muted)}
.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface-2);
  border-radius:var(--r-s);padding:14px 16px;margin:14px 0}
.callout h5{font-family:Poppins;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:5px}
.callout p{font-size:13.5px;line-height:1.55}
.term{border-bottom:2px dotted var(--brand);color:var(--brand);font-weight:700;cursor:help;position:relative}
.term:hover::after{content:attr(data-def);position:absolute;left:0;bottom:130%;width:230px;background:var(--ink);color:var(--surface);
  font-size:12px;font-weight:400;line-height:1.45;padding:10px 12px;border-radius:10px;z-index:30;box-shadow:var(--sh-3)}
html[data-mode="dark"] .term:hover::after{background:#050B14;color:#EEF3FA}

/* experience */
.sim{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.simrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.simout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.simout div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;text-align:center}
.simout b{display:block;font-family:Poppins;font-size:21px;font-weight:800;margin-bottom:2px}
.simout span{font-size:11px;color:var(--faint);font-weight:700}
.verdict{margin-top:14px;border-radius:var(--r-s);padding:13px 15px;font-size:13.5px;font-weight:600;line-height:1.5}

/* ============ MODAL ============ */
.veil{position:fixed;inset:0;background:rgba(10,18,32,.55);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:18px}
.modal{background:var(--surface);border-radius:var(--r-l);width:min(560px,100%);max-height:88vh;overflow-y:auto;
  box-shadow:var(--sh-3);animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
.modal .mh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal .mb{padding:22px}
.modal.dark{background:#101C2E;color:#EAF1FA;border:1px solid #24364F}
.modal.dark .mh{background:#101C2E;border-color:#24364F}
.modal.dark .opt{background:#16253B;border-color:#2A3D58;color:#EAF1FA}
.modal.dark .opt .k{background:#22344E;color:#9FB3CE}
.modal.dark .opt.right{border-color:#4FC98A;background:#14301F}
.modal.dark .opt.wrong{border-color:#E0B34C;background:#332913}
.modal.dark .muted,.modal.dark .tiny{color:#9FB3CE}
.stars{display:flex;gap:7px;justify-content:center;margin:6px 0 4px}
.stars svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.6}
.stars svg.on{fill:var(--accent)}

/* certificate */
.cert{background:linear-gradient(150deg,var(--brand),var(--brand-d));border-radius:var(--r);padding:26px;color:#fff;position:relative;overflow:hidden}
html[data-mode="dark"] .cert{color:var(--accent-ink)}
.cert::after{content:"";position:absolute;inset:11px;border:1px solid rgba(255,255,255,.35);border-radius:calc(var(--r) - 5px);pointer-events:none}
.cert .cap{font-family:Poppins;font-size:10.5px;letter-spacing:.2em;opacity:.85}
.cert h3{font-size:25px;font-weight:800;margin:9px 0 3px}
.cert .serial{font-family:ui-monospace,monospace;font-size:15px;font-weight:700;letter-spacing:.05em}
.cert .qr{width:64px;height:64px;background:#fff;border-radius:9px;padding:6px}

/* ============ DRAWERS ============ */
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--line);
  box-shadow:var(--sh-3);z-index:70;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer .db{flex:1;overflow-y:auto;padding:16px 18px 30px}
.ev{border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:10px;overflow:hidden;animation:fade .3s}
.ev .eh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--surface-2);font-size:12.5px;font-weight:800;font-family:Poppins}

/* ---------- API ---------- */
async function api(method, path, body){
  const init = { method, credentials:'same-origin', headers:{ accept:'application/json' } };
  if (body !== undefined) { init.headers['content-type']='application/json'; init.body=JSON.stringify(body); }
  const res = await fetch('/api/v1'+path, init);
  const data = res.status===204 ? null : await res.json().catch(()=>null);
  if (!res.ok) {
    const err = new Error(data && data.error ? data.error.message : 'Something went wrong. Try again.');
    err.status = res.status; err.code = data && data.error ? data.error.code : 'unknown';
    throw err;
  }
  return data;
}
// One action at a time, and every failure explained the way the server put it.
async function run(fn){
  if (S.busy) return;
  S.busy = true; document.body.classList.add('busy');
  try { await fn(); }
  catch (e) {
    if (e.status === 401) { S.me=null; S.pathway=null; S.events=[]; renderOutbox(); go('welcome'); toast('Please sign in to continue'); }
    else toast(e.message);
  }
  finally { S.busy = false; document.body.classList.remove('busy'); }
}

/* ---------- LESSON TEXT ----------
   The lesson body is a small Markdown subset, rendered with every piece
   of text escaped: ## steps, a "> **In practice**" callout, **bold**,
   and [[term|definition]] glossary terms. No HTML from the database is
   ever inserted as markup. */
function inline(text){
  const re=/\*\*([^*]+)\*\*|\[\[([^\]|]+)\|([^\]]+)\]\]/g;
  let out='', last=0, m;
  while ((m=re.exec(text))) {
    out += esc(text.slice(last, m.index));
    out += m[1]!==undefined ? `<b>${esc(m[1])}</b>` : `<span class="term" data-def="${esc(m[3])}">${esc(m[2])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(text.slice(last));
}
function parseLesson(md){
  const steps=[]; let callout=null;
  for (const block of String(md||'').split(/\n{2,}/)) {
    const lines = block.split('\n');
    if (lines[0].startsWith('## ')) steps.push({h:lines[0].slice(3), p:lines.slice(1).join(' ')});
    else if (lines[0].startsWith('> ')) {
      const body = lines.map(l=>l.replace(/^>\s?/,''));
      const title = /^\*\*(.+)\*\*$/.exec(body[0]);
      callout = title ? {h:title[1], p:body.slice(1).join(' ')} : {h:'Note', p:body.join(' ')};
    }
    else if (steps.length) steps[steps.length-1].p += ' ' + lines.join(' ');
  }
  return {steps, callout};
}

    <div class="simout">
      <div><b id="o1">25%</b><span>OF MARGIN LOST</span></div>
      <div><b id="o2">20%</b><span>MOVE TO ZERO</span></div>

    </div>
    <div class="verdict" id="verdict"></div>
  </div>`;
}
function bindSim(){
  const lv=$('#lv'), mv=$('#mv'); if(!lv) return;
  const upd=()=>{
    const L=+lv.value, M=+mv.value;
    const lost=Math.min(100, L*M), toZero=(100/L);
    $('#lvOut').textContent=L+'x'; $('#mvOut').textContent=M+'%';
    $('#o1').textContent=Math.round(lost)+'%';
    $('#o2').textContent=toZero.toFixed(1)+'%';
    const ok=lost<50;
    $('#o3').textContent= lost>=100?'Liquidated':ok?'Survivable':'Critical';
    $('#o3').style.color= lost>=100?'var(--bad)':ok?'var(--ok)':'var(--warn)';
    const v=$('#verdict');
    v.style.background= lost>=100?'var(--bad-t)':ok?'var(--ok-t)':'var(--warn-t)';
    v.textContent= lost>=100
      ? `At ${L}x, a ${M}% move erases your margin entirely. The position is closed for you, at whatever price the market offers.`
      : ok ? `At ${L}x you lose ${Math.round(lost)}% of your margin on a ${M}% move. You would need a ${toZero.toFixed(1)}% move to reach zero.`
      : `At ${L}x you are down ${Math.round(lost)}% of margin. Most venues would be issuing a margin call well before this point.`;
  };
  lv.oninput=upd; mv.oninput=upd; upd();
}

function renderTree(){
  const el=$('#tree'); if(!el||!S.pathway) return;
  const tierColor=t=>getComputedStyle(document.documentElement).getPropertyValue('--'+t).trim();
  const lessons=allLessons(), byId=new Map(lessons.map(l=>[l.id,l]));
  const dots=[]; for(let x=0;x<1140;x+=38){ for(let y=0;y<620;y+=38){ dots.push(`<circle cx="${x}" cy="${y}" r="1" fill="currentColor" opacity=".16"/>`);} }
  const edges=lessons.flatMap(b=>b.requires.filter(id=>byId.has(id)).map(id=>{
    const A=byId.get(id), pa=layoutFor(A), pb=layoutFor(b), mx=(pa.x+pb.x)/2;
    const done=A.state==='done';
    return `<path d="M${pa.x+46} ${pa.y} C ${mx} ${pa.y}, ${mx} ${pb.y}, ${pb.x-46} ${pb.y}"
      fill="none" stroke="${done?tierColor(b.tier):'currentColor'}" stroke-opacity="${done?'.85':'.28'}"
      stroke-width="${done?3:2}" stroke-dasharray="${done?'':'6 6'}" stroke-linecap="round"/>`;
  })).join('');
  const nodes=lessons.map(n=>{
    const st=n.state, c=tierColor(n.tier), p=layoutFor(n);
    const fill = st==='done'? c : st==='open'? 'var(--surface)' : 'var(--surface-2)';
    const stroke = st==='locked'? 'currentColor' : c;
    return `<g class="node" data-id="${n.id}" style="cursor:pointer">
      <circle cx="${p.x}" cy="${p.y}" r="42" fill="${fill}" stroke="${stroke}" stroke-width="${st==='open'?3.4:2}"
        stroke-opacity="${st==='locked'?.4:1}" stroke-dasharray="${st==='locked'?'7 6':''}"/>
      ${st==='open'?`<circle cx="${p.x}" cy="${p.y}" r="42" fill="none" stroke="${c}" stroke-width="2" opacity=".45">
        <animate attributeName="r" values="42;52;42" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".45;0;.45" dur="2.6s" repeatCount="indefinite"/></circle>`:''}
      <g transform="translate(${p.x-11},${p.y-13}) scale(.92)" fill="none"
         stroke="${st==='done'?'#fff':st==='locked'?'currentColor':c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         opacity="${st==='locked'?.5:1}">
        ${st==='done'?I.check:st==='locked'?I.lock:I.play}</g>
      <text x="${p.x}" y="${p.y+66}" text-anchor="middle" font-family="Poppins" font-size="13.5" font-weight="700"
        fill="currentColor" opacity="${st==='locked'?.45:.95}">${esc(n.title)}</text>
      <text x="${p.x}" y="${p.y+84}" text-anchor="middle" font-family="Nunito Sans" font-size="11.5"
        fill="currentColor" opacity=".5">${TIERS[n.tier].name} · ${n.minutes} min</text>
      ${st==='done'?`<circle cx="${p.x+31}" cy="${p.y-31}" r="11" fill="var(--ok)"/>
        <g transform="translate(${p.x+25},${p.y-37})" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">${I.check}</g>`:''}
    </g>`;
  }).join('');
  el.innerHTML=`<g id="world" transform="translate(${TV.x},${TV.y}) scale(${TV.k})" color="var(--ink)">
    <g opacity=".5">${dots.join('')}</g>${edges}${nodes}</g>`;
  el.querySelectorAll('.node').forEach(g=>{
    g.addEventListener('click',e=>{e.stopPropagation(); openPopover(g.dataset.id);});
  });
  bindPanZoom(el);
}
function bindPanZoom(el){
  let drag=false,sx=0,sy=0,ox=0,oy=0,moved=false;
  el.onpointerdown=e=>{ if(e.target.closest('.node')) return; drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=TV.x;oy=TV.y;el.classList.add('drag');el.setPointerCapture(e.pointerId);};
  el.onpointermove=e=>{ if(!drag) return; const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    TV.x=ox+dx*(1140/el.clientWidth); TV.y=oy+dy*(620/el.clientHeight);
    const w=el.querySelector('#world'); if(w) w.setAttribute('transform',`translate(${TV.x},${TV.y}) scale(${TV.k})`); };
  el.onpointerup=()=>{drag=false;el.classList.remove('drag');};
  el.onclick=()=>{ if(!moved) closePopover(); };
  el.onwheel=e=>{e.preventDefault(); zoom(e.deltaY<0?1.12:1/1.12);};
  if($('#zin')) $('#zin').onclick=()=>zoom(1.2);
  if($('#zout')) $('#zout').onclick=()=>zoom(1/1.2);
  if($('#zfit')) $('#zfit').onclick=()=>{TV.x=0;TV.y=0;TV.k=1;renderTree();};
}
function zoom(f){ TV.k=clamp(TV.k*f,.55,2.2); const w=$('#world'); if(w) w.setAttribute('transform',`translate(${TV.x},${TV.y}) scale(${TV.k})`); }
function closePopover(){ const p=$('#pop'); if(p) p.remove(); }
function openPopover(id){
  closePopover();
  const n=lessonById(id); if(!n) return;
  const el=$('#tree'), box=el.getBoundingClientRect(), wrapEl=el.parentElement, pos=layoutFor(n);
  const sc=Math.min(box.width/1140, box.height/620);
  const offX=(box.width-1140*sc)/2, offY=(box.height-620*sc)/2;
  const px=clamp(offX+(pos.x*TV.k+TV.x)*sc-134, 8, box.width-276);
  const py=clamp(offY+(pos.y*TV.k+TV.y)*sc+52, 8, box.height-250);
  const d=document.createElement('div'); d.className='popover'; d.id='pop';
  d.style.left=px+'px'; d.style.top=py+'px';
  d.innerHTML=`
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <span class="tag ${n.tier}">${TIERS[n.tier].name}</span>
      <span class="tiny">Module ${n.position}</span></div>
    <div class="h3" style="margin:9px 0 2px">${esc(n.title)}</div>
    <div class="tiny">${esc(n.course)} · ${n.minutes} minutes</div>
    <div class="reward"><span>${svg('bolt')}+${n.xp} XP</span>${n.state==='done'?`<span>${svg('check')}Verified</span>`:''}</div>
    ${n.state==='locked'
      ? `<div class="rationale wrong" style="margin:0 0 10px"><b>LOCKED</b>${esc(n.gateReason)}</div><button class="btn sec" style="width:100%" id="popClose">Close</button>`
      : `<button class="btn" style="width:100%" id="popGo">${n.state==='done'?'Revisit lesson':'Start lesson'} ${svg('arrow')}</button>`}`;
  wrapEl.appendChild(d);
  const g=$('#popGo'); if(g) g.onclick=()=>openLesson(n.id);
  const c=$('#popClose'); if(c) c.onclick=closePopover;
}

/* ---------- LESSON AND CHECK ---------- */
function openLesson(id){
  return run(async ()=>{
    S.lesson = await api('GET','/lessons/'+id);
    S.tab='watch';
    go('lesson');
    await loadEvents();
  });
}

function openCheck(){
  return run(async ()=>{
    const paper = await api('POST','/lessons/'+S.lesson.id+'/checks');
    showCheck(paper);
  });
}

function showCheck(paper){
  const qs=paper.questions, chosen={}; let i=0;
  const host=document.createElement('div'); host.className='veil';
  host.innerHTML=`<div class="modal dark" role="dialog" aria-modal="true" aria-label="Knowledge check">
    <div class="mh"><div><div class="eyebrow" style="color:var(--accent)">Knowledge check</div>
      <div class="h3" style="color:inherit">${esc(S.lesson.title)}</div></div>
      <button class="iconbtn" id="ckX" aria-label="Close" style="background:transparent;border-color:#2A3D58">${svg('close')}</button></div>
    <div class="mb" id="ckBody"></div></div>`;
  $('#modalHost').appendChild(host);
  host.querySelector('#ckX').onclick=()=>host.remove();
  const paint=()=>{
    const q=qs[i], all=qs.every(x=>chosen[x.id]);
    host.querySelector('#ckBody').innerHTML=`
      <div class="qhead"><span class="tiny" style="color:#9FB3CE">${i+1} of ${qs.length}</span>
        <div class="qdots">${qs.map((x,k)=>`<i class="${chosen[x.id]?'done':k===i?'now':''}"></i>`).join('')}</div></div>
      <div class="h2" style="line-height:1.35;color:inherit">${esc(q.prompt)}</div>
      <div id="ckOpts" style="margin-top:16px">
        ${q.options.map((o,k)=>`<button class="opt ${chosen[q.id]===o.key?'sel':''}" data-k="${esc(o.key)}"><span class="k">${'ABCDE'[k]}</span><span class="txt">${esc(o.text)}</span></button>`).join('')}
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button class="btn ghost" id="ckPrev" ${i===0?'disabled':''}>Back</button>
        ${i<qs.length-1
          ? `<button class="btn" id="ckNext" ${chosen[q.id]?'':'disabled'}>Next question ${svg('arrow')}</button>`
          : `<button class="btn" id="ckSubmit" ${all?'':'disabled'}>Submit answers ${svg('arrow')}</button>`}
      </div>
      <p class="tiny" style="color:#9FB3CE;margin-top:12px">Your answers are marked together when you submit. Two of three correct is a verified progression.</p>`;
    host.querySelectorAll('#ckOpts .opt').forEach(b=>b.onclick=()=>{ chosen[q.id]=b.dataset.k; paint(); });
    const prev=host.querySelector('#ckPrev'); if(prev) prev.onclick=()=>{ i--; paint(); };
    const next=host.querySelector('#ckNext'); if(next) next.onclick=()=>{ i++; paint(); };
    const sub=host.querySelector('#ckSubmit'); if(sub) sub.onclick=()=>run(async ()=>{
      const xpBefore=S.me.stats.xp;
      const result=await api('POST','/checks/'+paper.attemptId+'/submission',{answers:chosen});
      await refreshAll();
      showResult(host, paper, result, S.me.stats.xp-xpBefore);
    });
  };
  paint();
}

function showResult(host, paper, r, xpGained){
  const text=(q,key)=>{ const o=q.options.find(x=>x.key===key); return o?o.text:'No answer'; };
  const byId=new Map(r.feedback.map(f=>[f.questionId,f]));
  host.querySelector('#ckBody').innerHTML=`
    <div style="text-align:center" class="pop">
      <div class="stars">${[1,2,3].map(s=>`<svg class="${s<=r.stars?'on':''}" viewBox="0 0 24 24">${I.star}</svg>`).join('')}</div>
      <div class="h1" style="font-size:25px;margin:10px 0 4px;color:inherit">${r.passed?'Verified progression':'Not this time'}</div>
      <p class="muted" style="margin-bottom:14px">${r.correct} of ${r.total} correct. ${r.passed
        ? (xpGained>0?'This lesson is now verified.':'You had already verified this lesson.')
        : 'Two of three are needed. The lesson stays open, and a new paper is drawn each attempt.'}</p>
      ${xpGained>0?`<div class="row" style="justify-content:center;margin-bottom:14px"><span class="chip xp">${svg('bolt')}+${xpGained} XP</span></div>`:''}
      ${r.certificate?`<div class="rationale right" style="text-align:left"><b>CERTIFICATE ISSUED</b>You completed ${esc(r.certificate.courseTitle)}. Serial ${esc(r.certificate.serial)}.</div>`:''}
    </div>
    <div style="margin-top:8px">
      ${paper.questions.map((q,k)=>{ const f=byId.get(q.id); if(!f) return ''; const right=f.chosenKey===f.correctKey;
        return `<div style="margin-bottom:14px"><div class="tiny" style="color:#9FB3CE">Question ${k+1}</div>
          <div style="font-weight:700;margin:3px 0 6px">${esc(q.prompt)}</div>
          <div class="rationale ${right?'right':'wrong'}"><b>${right?'CORRECT':'NOT QUITE'}</b>
            ${right?'':`You chose: ${esc(text(q,f.chosenKey))}<br>Answer: ${esc(text(q,f.correctKey))}<br>`}${esc(f.rationale)}</div></div>`; }).join('')}
    </div>
    <div class="row" style="justify-content:center">
      ${r.certificate?`<button class="btn accent" id="ckCert">${svg('award')} View your certificate</button>`:''}
      ${r.passed?`<button class="btn" id="ckDone">Continue ${svg('arrow')}</button>`
               :`<button class="btn" id="ckRetry">Try again</button><button class="btn sec" id="ckBack">Back to lesson</button>`}
    </div>`;
  host.querySelector('.mb').scrollTop=0;
  if (xpGained>0 || r.certificate) burst();
  const d=host.querySelector('#ckDone'); if(d) d.onclick=()=>{ host.remove(); go('path'); };
  const c=host.querySelector('#ckCert'); if(c) c.onclick=()=>{ host.remove(); openCert(r.certificate.serial); };
  const t=host.querySelector('#ckRetry'); if(t) t.onclick=()=>{ host.remove(); openCheck(); };
  const b=host.querySelector('#ckBack'); if(b) b.onclick=()=>host.remove();
}

/* ---------- CERTIFICATE ---------- */
function openCert(serial){
  const cert=S.me.certificates.find(c=>c.serial===serial);
  if(!cert){ toast('That certificate is not on your record.'); return; }
  const url=location.origin+'/verify/'+encodeURIComponent(cert.serial);
  const host=document.createElement('div'); host.className='veil';
  host.innerHTML=`<div class="modal">
    <div class="mh"><div class="h3">Your certificate</div><button class="iconbtn" id="cX" aria-label="Close">${svg('close')}</button></div>
    <div class="mb">
      <div class="cert">
        <div class="cap">${esc(ACADEMY.name.toUpperCase())}</div>
        <h3>${esc(S.me.user.displayName)}</h3>
        <p style="opacity:.9;font-size:14px">has completed and verified</p>
        <div style="font-family:Poppins;font-size:18px;font-weight:700;margin-top:4px">${esc(cert.courseTitle)}</div>
        <div style="margin-top:22px;position:relative">
          <div class="cap" style="margin-bottom:5px">VERIFICATION SERIAL</div>
          <div class="serial">${esc(cert.serial)}</div>
          <div style="font-size:12px;opacity:.85;margin-top:5px">Issued ${fmtDate(cert.issuedAt)}</div>
        </div>
      </div>
      <div class="card" style="margin-top:14px;padding:16px">
        <div class="tiny" style="margin-bottom:6px">PUBLIC VERIFICATION PAGE</div>
        <div style="font-family:ui-monospace,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;word-break:break-all">${esc(url)}</div>
        <p class="tiny" style="margin-top:9px">Anyone can check this without an account. It shows the name, the course and the date, and nothing else.</p>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn sec sm" id="cCopy">${svg('copy')} Copy link</button>
        <a class="btn sec sm" href="${esc(url)}" target="_blank" rel="noopener">${svg('arrow')} Open verification page</a>
      </div>
    </div></div>`;
  $('#modalHost').appendChild(host);
  host.querySelector('#cX').onclick=()=>host.remove();
  host.querySelector('#cCopy').onclick=()=>{
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('Verification link copied'),()=>toast(url));
    else toast(url);
  };
}

/* ---------- DRAWERS ---------- */
function renderSpec(){
  const key = S.route==='catalogue'?'path' : S.route==='me'?'progress' : S.route;
  const sp = SPEC[key] || SPEC.path;
  $('#specDrawer').innerHTML=`
    <div class="dh"><div><div class="eyebrow">Spec mode</div><div class="h3">${sp.title}</div></div>
      <button class="iconbtn" id="specX" aria-label="Close">${svg('close')}</button></div>
    <div class="db">
      <div class="kv">
        <b>Phase</b><span>${sp.phase}</span>
        <b>Lifecycle</b><span>${sp.state}</span>
        <b>Learner goal</b><span><i>${sp.goal}</i></span>
        <b>Principle</b><span>${sp.principle}</span>
        <b>Metric</b><span>${sp.metric}</span>
      </div>
      <div class="eyebrow" style="margin-bottom:9px">Features on this screen</div>
      ${sp.feats.map(f=>{const x=FEAT[f]; if(!x) return '';
        return `<div class="specrow"><div class="row" style="justify-content:space-between;gap:8px">
          <span><span class="id">${f}</span><b style="font-size:13.5px">${x[0]}</b></span>
          <span class="pri ${x[1]}">${x[1]}</span></div>
          <div class="tiny" style="margin-top:5px">${x[2]}</div></div>`}).join('')}
      <div class="sep"></div>
      <div class="eyebrow" style="margin-bottom:8px">Rules in force (enforced by the server)</div>
      <div class="specrow"><b style="font-size:13px">Baseline</b><div class="tiny" style="margin-top:4px">placement × 0.60 + self-rating × 0.40, per tier</div></div>
      <div class="specrow"><b style="font-size:13px">Gates</b><div class="tiny" style="margin-top:4px">Learn and Safeguard open · Apply at Learn ≥ 50 · Specialise at Learn ≥ 70 and Safeguard ≥ 50 · plus each lesson's prerequisites</div></div>
      <div class="specrow"><b style="font-size:13px">Verified progression</b><div class="tiny" style="margin-top:4px">2 of 3 knowledge check questions correct. North Star metric, counted once per lesson.</div></div>
      <div class="specrow"><b style="font-size:13px">Certificate</b><div class="tiny" style="margin-top:4px">Issued when every lesson in a course is verified. E14-F02 course assessments will replace this trigger.</div></div>
      <div class="specrow"><b style="font-size:13px">Lifecycle</b><div class="tiny" style="margin-top:4px">Registered → Onboarded → Placed → Activated → Certified. Currently: <b>${S.me?LIFECYCLE[S.me.user.lifecycle]:'Visitor'}</b></div></div>
    </div>`;
  const x=$('#specX'); if(x) x.onclick=()=>{S.spec=false;$('#specDrawer').classList.remove('open');renderChrome();};
}
function jsonHTML(o){
  return esc(JSON.stringify(o,null,2))
    .replace(/&quot;([^&]+?)&quot;:/g,'<span class="k">&quot;$1&quot;</span>:')
    .replace(/: &quot;(.*?)&quot;/g,': <span class="s">&quot;$1&quot;</span>')
    .replace(/: (-?\d+\.?\d*)/g,': <span class="n">$1</span>');
}
function renderOutbox(){
  $('#outboxDrawer').innerHTML=`
    <div class="dh"><div><div class="eyebrow">Enterprise outbox</div><div class="h3">Your events, from the database</div></div>
      <button class="iconbtn" id="obX" aria-label="Close">${svg('close')}</button></div>
    <div class="db">
      <p class="tiny" style="margin-bottom:14px">Every learning milestone is written to a transactional outbox in the same database transaction as the milestone itself, then delivered to the broker CRM with retries and an idempotency key. These are your events as the database holds them, newest first. Nothing here is a payment instruction.</p>
      ${S.events.length? S.events.map(e=>`
        <div class="ev"><div class="eh"><span class="dot"></span>${esc(e.type)}<span class="tag ${e.status==='delivered'?'ok':'lock'}" style="margin-left:6px">${esc(e.status)}</span><time>${fmtTime(e.createdAt)}</time></div>
        <div class="tiny" style="padding:6px 13px 0">key <code>${esc(e.idempotencyKey)}</code></div>
        <pre>${jsonHTML(e.payload)}</pre></div>`).join('')
        : '<p class="muted">No events yet. Sign up, get placed, or pass a knowledge check to see them arrive.</p>'}
    </div>`;
  const x=$('#obX'); if(x) x.onclick=()=>{S.outbox=false;$('#outboxDrawer').classList.remove('open');renderChrome();};
}

/* ---------- BINDINGS ---------- */
function bind(){
  const on=(sel,fn)=>{const e=$(sel); if(e) e.onclick=fn;};

  document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{ S.authMode=b.dataset.auth; S.authError=''; render(); });
  const form=$('#authForm');
  if(form) form.onsubmit=e=>{
    e.preventDefault();
    const signup=S.authMode==='signup';
    const email=$('#inEmail').value.trim(), password=$('#inPass').value;
    if(signup && !$('#inConsent').checked){ S.authError='Please agree to the terms and privacy policy.'; render(); return; }
    run(async ()=>{
      try {
        if(signup) await api('POST','/auth/signup',{email,password,displayName:$('#inName').value.trim(),...(IB_REF?{ibRefCode:IB_REF}:{})});
        else await api('POST','/auth/login',{email,password});
      } catch(err){ if(err.status===401||err.status===409||err.status===400||err.status===429){ S.authError=err.message; render(); return; } throw err; }
      S.authError='';
      await loadMe(); await loadPathway(); await loadEvents();
      await resume();
    });
  };

  document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.onboarding.goal=b.dataset.goal;render();});
  document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{S.onboarding.dailyMinutes=+b.dataset.min;render();});
  document.querySelectorAll('[data-cf]').forEach(sl=>sl.oninput=()=>{
    S.onboarding.selfRating[sl.dataset.cf]=+sl.value; const o=$('#cf-'+sl.dataset.cf); if(o) o.textContent=sl.value;});
  on('#goPlace',()=>run(async ()=>{
    await api('PUT','/onboarding',S.onboarding);
    await loadMe(); await loadEvents();
    await startPlacement();
  }));

  const answer=key=>run(async ()=>{
    const q=S.paper.questions[S.qi]; S.answers[q.id]=key;
    if(S.qi<S.paper.questions.length-1){ S.qi++; render(); return; }
    await api('POST','/placement/'+S.paper.attemptId+'/submission',{answers:S.answers});
    S.paper=null;
    await refreshAll();
    go('baseline');
  });
  document.querySelectorAll('.opt[data-a]').forEach(b=>b.onclick=()=>answer(b.dataset.a));
  on('#skipQ',()=>answer(null));

  on('#goPath',()=>go('path'));
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const l=lessonById(b.dataset.open);
    if(l&&l.state==='locked'){ toast(l.gateReason); return; }
    openLesson(b.dataset.open);
  });
  document.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>openCert(b.dataset.cert));

  on('#backPath',()=>run(async ()=>{ await loadPathway(); go('path'); }));
  document.querySelectorAll('[data-tab]').forEach(b=>{ if(b.closest('#authForm')) return; b.onclick=()=>{S.tab=b.dataset.tab;render();}; });
  document.querySelectorAll('[data-sec]').forEach(a=>a.onclick=e=>{e.preventDefault();
    if(a.dataset.last==='1') openCheck(); else { S.tab='read'; render(); }});
  on('#tdrawBtn',()=>$('#tdraw').classList.toggle('open'));
  document.querySelectorAll('[data-jump]').forEach(l=>l.onclick=()=>toast('Jumped to '+l.dataset.jump+' in the video'));
  on('#player',()=>toast('Video playback uses signed, expiring links in production'));
  on('#startCheck',openCheck);
  on('#logout',()=>run(async ()=>{
    await api('POST','/auth/logout');
    S.me=null; S.pathway=null; S.events=[]; S.authMode='login'; renderOutbox(); go('welcome');
  }));
  bindSim();
}

/* ---------- RENDER ---------- */
function render(){
  // Screens that need a placed learner fall back to the start if there is none.
  if(['path','catalogue','progress','me','baseline','lesson'].includes(S.route) && !placed()) S.route = S.me ? 'about' : 'welcome';
  if(S.route==='lesson' && !S.lesson) S.route='path';
  if(S.route==='placement' && !S.paper) S.route = S.me ? 'about' : 'welcome';
  const v=V[S.route]||V.welcome;
  $('#view').innerHTML=v();
  renderChrome(); renderSpec(); bind();
  if(S.route==='path') requestAnimationFrame(renderTree);
  document.body.classList.toggle('narrow', S.phone);
}

/* ---------- GLOBAL UI ---------- */
$('#btnPhone').onclick=()=>{ S.phone=!S.phone; $('#stage').classList.toggle('phone',S.phone); render(); };
$('#btnSpec').onclick=()=>{ S.spec=!S.spec; $('#specDrawer').classList.toggle('open',S.spec); renderSpec(); renderChrome(); };
$('#btnOutbox').onclick=()=>{ S.outbox=!S.outbox; $('#outboxDrawer').classList.toggle('open',S.outbox); renderChrome();
  if(S.outbox) run(loadEvents); };
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  const k=e.key.toLowerCase();
  if(k==='d'){ $('#btnSpec').click(); }
  if(k==='e'){ $('#btnOutbox').click(); }
  if(k==='m'){ $('#btnPhone').click(); }
  if(k==='escape'){ document.querySelectorAll('.veil').forEach(v=>v.remove()); closePopover(); }
});
setTimeout(()=>$('#hint').classList.add('hide'),6000);

/* ---------- START: ask the server who this is ---------- */
renderOutbox(); render();
(async ()=>{
  try { await loadMe(); } catch(e){ if(e.status!==401) toast(e.message); return; }
  await run(async ()=>{ await loadPathway(); await loadEvents(); await resume(); });
})();
</script>
</body>
